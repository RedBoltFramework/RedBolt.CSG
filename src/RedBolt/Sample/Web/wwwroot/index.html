<!DOCTYPE html>
<html lang="en">
<head>
  <!-- <redbolt-generated name="web-title"> -->
  <title>RedBolt.CSG samples</title>
  <!-- </redbolt-generated name="web-title"> -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preload" id="webassembly">
  <script type="importmap"></script>
  <script type="module" src="main#[.{fingerprint}].js"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #11151c;
      color: #edf2f7;
    }
    html, body { margin: 0; padding: 0; overflow: hidden; }
    main { min-height: 100vh; display: grid; place-items: center; }
    section { width: min(32rem, calc(100vw - 3rem)); }
    select, button {
      box-sizing: border-box;
      width: 100%;
      margin-top: 0.75rem;
      padding: 0.8rem;
      font: inherit;
    }
    button { cursor: pointer; }
    #runner { display: none; width: 100vw; height: 100vh; }
    #runner.active { display: block; }
    #runner header {
      position: fixed;
      z-index: 1;
      padding: 0.6rem 0.8rem;
      background: rgb(17 21 28 / 80%);
    }
    #runner a { color: #9dc8ff; }
    body.mobile #runner header #result { display: none; }
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
      border: none;
      cursor: default !important;
      touch-action: none;
    }
    #loading {
      position: fixed;
      z-index: 2;
      inset: 0;
      display: grid;
      place-content: center;
      text-align: center;
      background: #11151c;
    }
    #loading[hidden] { display: none; }
    #progress { margin-top: 0.5rem; }
    #fullscreen-button {
      position: fixed;
      z-index: 2;
      width: 2rem;
      height: 2rem;
      left: 50%;
      top: 4px;
      transform: translateX(-50%);
      padding: 0;
      margin: 0;
      stroke: #999;
      stroke-width: 10px;
      background: transparent;
      border: 0;
    }
    #fullscreen-button:hover { fill: #999; cursor: pointer; }
    #mobile-controls {
      position: fixed;
      z-index: 3;
      inset: 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #mobile-controls[hidden] { display: none; }
    #mobile-help {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      max-width: min(22rem, calc(100vw - 7rem));
      padding: 0.5rem 0.7rem;
      border-radius: 0.5rem;
      background: rgb(17 21 28 / 82%);
      pointer-events: auto;
    }
    #mobile-help summary { cursor: pointer; font-weight: 600; }
    #mobile-help p { margin: 0.45rem 0 0; font-size: 0.9rem; }
    #mobile-dpad, #mobile-actions {
      position: absolute;
      bottom: max(0.75rem, env(safe-area-inset-bottom));
      display: grid;
      gap: 0.35rem;
      pointer-events: auto;
    }
    #mobile-dpad {
      left: max(0.75rem, env(safe-area-inset-left));
      grid-template: repeat(3, 3.4rem) / repeat(3, 3.4rem);
    }
    #mobile-actions {
      right: max(0.75rem, env(safe-area-inset-right));
      grid-template-columns: repeat(2, minmax(4.2rem, auto));
      align-content: end;
    }
    #mobile-controls button {
      width: auto;
      min-width: 3.4rem;
      min-height: 3.4rem;
      margin: 0;
      padding: 0.45rem;
      border: 1px solid rgb(255 255 255 / 45%);
      border-radius: 0.65rem;
      color: #fff;
      background: rgb(17 21 28 / 68%);
      touch-action: none;
    }
    #mobile-controls button.active { background: rgb(82 137 204 / 88%); }
    #mobile-up { grid-column: 2; grid-row: 1; }
    #mobile-left { grid-column: 1; grid-row: 2; }
    #mobile-down { grid-column: 2; grid-row: 3; }
    #mobile-right { grid-column: 3; grid-row: 2; }
    @media (max-height: 480px) {
      #mobile-dpad { grid-template: repeat(3, 3rem) / repeat(3, 3rem); }
      #mobile-controls button { min-width: 3rem; min-height: 3rem; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <main>
    <section id="selector">
      <!-- <redbolt-generated name="web-heading"> -->
      <h1>RedBolt.CSG samples</h1>
      <!-- </redbolt-generated name="web-heading"> -->
      <p>Choose a sample to load in WebAssembly.</p>
      <select id="sample" aria-label="Sample">
        <!-- <redbolt-generated name="web-sample-options"> -->
        <option value="csg" data-application="RedBolt.Sample.CSG.CsgShowcase" data-mobile-help="Drag to look. Use the direction pad to move." data-mobile-movement="wasd" data-mobile-controls="key|Shift|Sprint;mouse|Left|Fire;mouse|Right|Mud">Constructive Solid Geometry</option>
        <!-- </redbolt-generated name="web-sample-options"> -->
      </select>
      <button id="load" type="button">Load sample</button>
    </section>
    <section id="runner">
      <header>
        <a href="./">All samples</a>
        <span id="result" data-status="loading">Loading…</span>
      </header>
      <canvas id="canvas" tabindex="-1"></canvas>
      <div id="mobile-controls" hidden>
        <details id="mobile-help" open>
          <summary>Touch controls</summary>
          <p id="mobile-help-text"></p>
        </details>
        <div id="mobile-dpad" aria-label="Movement controls"></div>
        <div id="mobile-actions" aria-label="Action controls"></div>
      </div>
      <div id="loading">
        <div id="status">Downloading...</div>
        <progress hidden id="progress" max="100" value="10"></progress>
      </div>
      <button id="fullscreen-button" type="button" aria-label="Toggle fullscreen" hidden>
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <path d="M93.1,139.6l46.5-46.5L93.1,46.5L139.6,0H0v139.6l46.5-46.5L93.1,139.6z M93.1,372.4l-46.5,46.5L0,372.4V512h139.6l-46.5-46.5l46.5-46.5L93.1,372.4z M372.4,139.6H139.6v232.7h232.7V139.6z M325.8,325.8H186.2V186.2h139.6V325.8z M372.4,0l46.5,46.5l-46.5,46.5l46.5,46.5l46.5-46.5l46.5,46.5V0H372.4z M418.9,372.4l-46.5,46.5l46.5,46.5L372.4,512H512V372.4l-46.5,46.5L418.9,372.4z"/>
        </svg>
      </button>
    </section>
  </main>
</body>
</html>
